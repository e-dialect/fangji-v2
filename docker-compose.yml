services:
  backend:
    build: ./backend
    # Optional host-side backend binding for local reverse proxy/debug access.
    # Traefik deployments should keep this disabled and let frontend proxy /api to backend:8090.
    # ports:
    #   - "${BACKEND_PORT:-127.0.0.1:8090}:8090"
    environment:
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      - APP_ADMIN_NAME=${APP_ADMIN_NAME:-管理员}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_ALLOWED_ORIGINS=${PB_ALLOWED_ORIGINS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      # Persist PocketBase data on the host for easy backup and migration.
      - ./pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    # Optional direct host port mapping. Keep disabled when Traefik routes to this container.
    # ports:
    #   - "${FRONTEND_PORT:-8080}:80"
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.http.routers.fangji.rule=Host(`${TRAEFIK_HOST:-fangji.example.com}`)"
      - "traefik.http.routers.fangji.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fangji.tls=true"
      - "traefik.http.routers.fangji.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Traefik should route to the frontend Nginx container port, not the host port or backend port.
      - "traefik.http.services.fangji.loadbalancer.server.port=80"
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL:-}
      - ENABLE_POCKETBASE_ADMIN_UI=${ENABLE_POCKETBASE_ADMIN_UI:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
