services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8090}:8090"
    environment:
      - APP_ADMIN_EMAIL=${APP_ADMIN_EMAIL:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      - APP_ADMIN_NAME=${APP_ADMIN_NAME:-管理员}
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-}
      - PB_ALLOWED_ORIGINS=${PB_ALLOWED_ORIGINS:-}
    volumes:
      # Persist PocketBase data (uploads, database) across container restarts
      - pb_data:/pb/pb_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - VITE_BACKEND_URL=${BACKEND_URL:-}
      - PB_URL=${PB_URL:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pb_data:
