services:
  backend:
    build: ./backend
    ports:
      - "8090:8090"
    volumes:
      # Persist PocketBase data (uploads, database) across container restarts
      - pb_data:/pb/pb_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    environment:
      - VITE_PB_URL=http://localhost:8090
      # Windows / Docker Desktop 热更新关键
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # 本地代码挂载 → 实现热更新
      - ./frontend:/app
      # 防止 node_modules 被覆盖
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pb_data: